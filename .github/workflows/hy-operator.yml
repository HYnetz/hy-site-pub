name: hy-operator

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Command, e.g. /hy status"
        required: true
        default: "/hy status"
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  operator:
    if: contains(github.event.comment.body, '/hy') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run HY operator
        env:
          HY_CMD: ${{ github.event.inputs.cmd || github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 ops/hy_operator.py > reply.md
          if [ ! -s reply.md ]; then
            echo "### HY" > reply.md
            echo "Empty reply (no /hy line found?)" >> reply.md
          fi
          echo "=== reply.md ==="
          sed -n '1,120p' reply.md

          # commit seeds if changed
          if git status --porcelain | grep -q 'seeds/all.txt'; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seeds/all.txt
            git commit -m "seeds: update (via hy operator)" || true
            git push
          fi

      - name: Reply in the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reply.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
